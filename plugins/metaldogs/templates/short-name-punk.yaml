slug: short-name-punk
genre: punk
style_category: typography_stress
prompt_instructions:
  text: >-
    Monochrome punk style dog portrait with bold short name lettering, rough
    ink texture on black. Preserve breed and markings. No color. Leave background
    clean for print isolation.
  prompt_version: g2-v1
model_parameters:
  model: gpt-image-2.5-sunburst
  width: 1024
  height: 1024
  seed: 5
photo_requirements:
  pose: head_front
  background_hint: plain
  lighting_hint: harsh
text_fields:
  editable:
    - key: dog_name
      max_length: 6
      allowed_charset: latin_polish
  fixed: []
output_config:
  canvas_width: 1024
  canvas_height: 1024
  monochrome: true
  print_area: { x: 0, y: 0, width: 1024, height: 1024 }
