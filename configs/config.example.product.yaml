# Copy into config.yaml. Nothing loads this file.
# plugins:
#   metaldogs:                   # Metal Dogs product plugin (dark by default; Extra slug)
#     enabled: false             # or SHOPANDA_PLUGINS_METALDOGS_ENABLED=true
#     generation:                # or generation_provider / generation.provider; env SHOPANDA_PLUGINS_METALDOGS_GENERATION_*
#       provider: fake
#       max_retries: 3
#       max_attempts_per_design: 3
#       cooldown_seconds: 30
#     order_snapshot:            # or order_snapshot_enabled; env SHOPANDA_PLUGINS_METALDOGS_ORDER_SNAPSHOT_ENABLED
#       enabled: false           # when false, snapshot jobs and reconcile_snapshots are not registered, no OrderSource is bound, and metaldogs:snapshots reconcile --fix is refused. Reconcile (with or without --order) exits "order source is not bound" and prints nothing. When true, Init calls Require(CapOrders) and binds adapters/hostorders from Host.Orders(); a paid custom-tee checkout enqueues the snapshot jobs. A root that asserts capabilities fails boot if that port is unbound (required capability "orders" not bound). A root that does not assert capabilities leaves the source nil and those jobs fail with "order source is not bound". The report prints only when a source is bound.
