# Copy into config.yaml. Nothing loads this file.
# plugins:
#   metaldogs:                   # Metal Dogs product plugin (dark by default; Extra slug)
#     enabled: false             # or SHOPANDA_PLUGINS_METALDOGS_ENABLED=true
#     generation:                # or generation_provider / generation.provider; env SHOPANDA_PLUGINS_METALDOGS_GENERATION_*
#       provider: fake
#       max_retries: 3
#       max_attempts_per_design: 3
#       cooldown_seconds: 30
#     production_spec:           # omit the section unless a print spec is configured. No defaults. Absent keeps prepare_production_artwork at pending_spec. Every field is required when the section is present; a missing or invalid field ends plugin Init (worker, scheduler, and the jobs CLI refuse to start; serve starts with metaldogs inactive). width_px, height_px, and dpi below are keys only (example-only, not a printer size).
#       width_px:                # example-only
#       height_px:               # example-only
#       dpi:                     # example-only
#       require_transparency:    # true or false
#       color_profile: srgb      # only srgb
#       upscale_policy: reject   # reject or upscale
#     order_snapshot:            # or order_snapshot_enabled; env SHOPANDA_PLUGINS_METALDOGS_ORDER_SNAPSHOT_ENABLED
#       enabled: false           # when false, snapshot jobs and reconcile_snapshots are not registered, no OrderSource is bound, and metaldogs:snapshots reconcile --fix is refused. Reconcile (with or without --order) exits "order source is not bound" and prints nothing. The artwork route, metaldogs.snapshots.read, and metaldogs:order-artwork are not registered either (E5). The order-thumbnail route is not registered either. When true, Init calls Require(CapOrders) and binds adapters/hostorders from Host.Orders(); a paid custom-tee checkout enqueues the snapshot jobs; the admin artwork route and the CLI are registered. A root that asserts capabilities fails boot if that port is unbound (required capability "orders" not bound). A root that does not assert capabilities leaves the source nil and those jobs fail with "order source is not bound". The report prints only when a source is bound. Artwork URLs are 300s and each one is a row in metaldogs_artwork_access_log.
#     thumbnail_signing_key:     # no default. Env SHOPANDA_PLUGINS_METALDOGS_THUMBNAIL_SIGNING_KEY. At least 32 characters and a freshly generated random secret (e.g. 32 bytes of CSPRNG output, hex or base64), not a passphrase and not reused; shorter fails plugin Init (the value is not included in the error). Absent is not a boot error: GET /api/customizer/order-thumbnails/{token} is not registered and OrderThumbnailURL returns empty, including when order_snapshot.enabled is true.
#     public_base_url:           # no default. Env SHOPANDA_PLUGINS_METALDOGS_PUBLIC_BASE_URL. Absolute http(s) store origin used to build order-thumbnail links, no query or fragment. The plugin cannot read server.public_base_url: Host.ConfigValue is plugin-scoped and Host.PlatformConfig allows only search.engine, cache.driver, queue.driver, and media.storage. Empty leaves the thumbnail route usable but OrderThumbnailURL returns an error when a line has a thumbnail. The order.line.display hook (email and both order pages) registers only when this origin is https. Label and alt are en, pl, de, fr, es (BCP 47 primary subtag; unknown or empty uses en). http, including http://localhost, logs metaldogs.order_line_display.public_base_url once at Init and does not register the hook. The platform also drops an image URL whose host is not public, so a local origin does not show the picture.
